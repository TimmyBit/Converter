<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <title>Converter</title>
</head>
<body>
    <header>
        <div class="container">
            <div id="top">
                <h1>Converter</h1>
                <select name="color-theme" id="color-theme" class="border-theme">
                    <option value="Blue">Blue</option>
                    <option value="Purple">Purple</option>
                    <option value="Cyan">Cyan</option>
                    <option value="Green">Green</option>
                    <option value="Red">Red</option>
                    <option value="Orange">Orange</option>
                    <option value="Yellow">Yellow</option>
                </select>
            </div>

            <nav>
                <button class="option bottom-theme" data-target="temperature">Temperature</button>
                <button class="option bottom-theme" data-target="weight">Weight</button>
                <button class="option bottom-theme" data-target="length">Length</button>
                <button class="option bottom-theme" data-target="volume">Volume</button>
                <button class="option bottom-theme" data-target="speed">Speed</button>
                <button class="option bottom-theme" data-target="currency">Currency</button>
            </nav>
        </div>
    </header>

    <section>
        <!-- Home -->
        <div class="container measurement active">
            <h2>Select a measurement to convert</h2>
        </div>

        <!-- Temperature -->
        <div class="container measurement" id="temperature">
            <div class="from">
                <h1>From:</h1>
                <input type="number" class="border-theme">
                <select name="temprature-from" id="temperature-select-from" class="border-theme">
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Celcius">Celcius</option>
                </select>
            </div>
            <div class="to">
                <h1>To:</h1>
                <input type="number" class="border-theme">
                <select name="temperature-to" id="temperature-select-to" class="border-theme">
                    <option value="Celcius">Celcius</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                </select>   
            </div>
        </div>

        <!-- Weight -->
        <div class="container measurement" id="weight">
            <div class="from">
                <h1>From:</h1>
                <input type="number" class="border-theme">
                <select name="weight-from" id="weight-select-from" class="border-theme">
                    <option value="Pounds">Pounds</option>
                    <option value="Grams">Grams</option>
                </select>
            </div>
            <div class="to">
                <h1>To:</h1>
                <input type="number" class="border-theme">
                <select name="weight-to" id="weight-select-to" class="border-theme">
                    <option value="Grams">Grams</option>
                    <option value="Pounds">Pounds</option>
                </select>   
            </div>
        </div>

        <!-- Length -->
        <div class="container measurement" id="length">
            <div class="from">
                <h1>From:</h1>
                <input type="number" class="border-theme">
                <select name="length-from" id="length-select-from" class="border-theme">
                    <option value="Inches">Inches</option>
                    <option value="Centimeters">Centimeters</option>
                </select>
            </div>
            <div class="to">
                <h1>To:</h1>
                <input type="number" class="border-theme">
                <select name="length-to" id="length-select-to" class="border-theme">
                    <option value="Centimeters">Centimeters</option>
                    <option value="Inches">Inches</option>
                </select>   
            </div>
        </div>

        <!-- Volume -->
        <div class="container measurement" id="volume">
            <div class="from">
                <h1>From:</h1>
                <input type="number" class="border-theme">
                <select name="volume-to" id="volume-select-from" class="border-theme">
                    <option value="Ounces">Ounces</option>
                    <option value="Milliliters">Milliliters</option>
                </select>
            </div>
            <div class="to">
                <h1>To:</h1>
                <input type="number" class="border-theme">
                <select name="volume-to" id="volume-select-to" class="border-theme">
                    <option value="Milliliters">Milliliters</option>
                    <option value="Ounces">Ounces</option>
                </select>   
            </div>
        </div>

        <!-- Speed -->
        <div class="container measurement" id="speed">
            <div class="from">
                <h1>From:</h1>
                <input type="number" class="border-theme">
                <select name="speed-from" id="speed-select-from" class="border-theme">
                    <option value="Miles">Miles/h</option>
                    <option value="Kilometers">Kilometers/h</option>
                </select>
            </div>
            <div class="to">
                <h1>To:</h1>
                <input type="number" class="border-theme">
                <select name="speed-to" id="speed-select-to" class="border-theme">
                    <option value="Kilometers">Kilometers/h</option>
                    <option value="Miles">Miles/h</option>
                </select>   
            </div>
        </div>

        <!-- Currency -->
        <div class="container measurement" id="currency">
            <h1>Work in progress...</h1>
        </div>
    </section>

    <script src="./script/script.js"></script>
</body>
</html>
