<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <title>Workshop</title>
</head>
<body class="dark">
    <div class="container">
        
        <div class="left">
            <h1>To Do List</h1>
            <div class="top-left">
                <div class="add dark-box box">
                    <h2>Add tasks to the list</h2>
                    <input type="text" id="task-input">
                    <button id="btn-add" class="dark-box btn-box"><i class="fa-solid fa-plus"></i></button>
                </div>
                <button class="theme dark-box btn-box"><i class="fa-solid fa-moon"></i></button>
            </div>
            
            <ul id="task-list" class="dark-box box"></ul>
        </div>

        <div class="sidebar dark-box box">
            <div class="filter">
                <h2>Filter</h2>
                <select name="filter-menu" id="filter-menu">
                    <option value="All Items">All Items</option>
                    <option value="Incomplete">Incomplete</option>
                    <option value="Completed">Completed</option>
                </select>
                <button id="mark-done" class="dark-box btn-box">Mark All As Done</button>
                <button id="clear-comp" class="dark-box btn-box">Clear Completed</button>
            </div>
                
            <div class="counter">
                <ul>
                    <li>
                        <h3>Total</h3>
                        <h4 id="total">0</h4>
                    </li>
                    <li>
                        <h3>Complete</h3>
                        <h4 id="complete">0</h4>
                    </li>
                    <li>
                        <h3>Incomplete</h3>
                        <h4 id="incomplete">0</h4>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="./script/script.js"></script>
</body>
</html>
